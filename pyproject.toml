[project]
name = "tripwire"
version = "0.1.0"
description = "Real-time market-abuse surveillance over a simulated exchange"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka>=2.5",
    "msgspec>=0.18.6",
    "numpy>=2.0",
    "ollama>=0.4",
    "psycopg[binary]>=3.2",
    "scikit-learn>=1.5",
    "sortedcontainers>=2.4.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["tripwire"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# Strict on the core packages: the engine, detectors and shared schemas.
[[tool.mypy.overrides]]
module = ["tripwire.exchange.*", "tripwire.detectors.*", "tripwire.common.*"]
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_subclassing_any = true
no_implicit_reexport = true
strict_equality = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["sortedcontainers.*", "sklearn.*", "joblib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["slow: excluded from `make check`, run by `make check-full`"]
