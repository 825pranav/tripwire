# Scrapes the API's /metrics, which reads the same heartbeats, lag and counts as `make doctor`.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: tripwire
    static_configs:
      - targets: ["api:8000"]
